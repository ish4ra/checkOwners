[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "checkowners"
version = "0.5.0"
description = "Infer CODEOWNERS from git history with confidence scoring, knowledge graphs, expertise decay detection, and team topology inference. CI-native."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Samir Musali", email = "samir.musali@gmail.com" },
]
keywords = [
    "codeowners",
    "git",
    "ownership",
    "drift-detection",
    "cli",
    "github-actions",
    "knowledge-graph",
    "expertise-decay",
    "team-topology",
    "platform-engineering",
    "code-review",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Version Control :: Git",
    "Typing :: Typed",
]
# Core inference is pure git via subprocess: no GitPython, no PyGithub.
# GitHub API features (handle search, teams, review coverage) live behind
# the optional "github" extra and degrade gracefully when absent.
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
graph = [
    "networkx>=3.0",
]
github = [
    "pygithub>=2.0.0",
]
all = [
    "networkx>=3.0",
    "pygithub>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/smusali/checkowners"
Issues = "https://github.com/smusali/checkowners/issues"
Source = "https://github.com/smusali/checkowners"
Documentation = "https://github.com/smusali/checkowners/blob/main/docs/USAGE.md"
Changelog = "https://github.com/smusali/checkowners/blob/main/docs/CHANGELOG.md"

[project.scripts]
checkowners = "checkowners.cli:main"

[tool.hatch.build.targets.sdist]
exclude = [
    ".claude",
    ".instructions",
    ".pre-commit-config.yaml",
    "tools",
    "*.whl",
]

[tool.hatch.envs.default]
dependencies = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4.0",
    "mypy>=1.0",
    "types-PyYAML",
    "networkx>=3.0",
    "pygithub>=2.0.0",
]

[tool.hatch.envs.default.scripts]
test = [
    "pytest {args:tests/}",
    "coverage report --include=checkowners/patterns.py,checkowners/analyze.py,checkowners/drift.py,checkowners/generate.py --show-missing",
]
lint = ["ruff check .", "mypy --strict checkowners/"]
fmt = "ruff format ."

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# S (bandit) and PTH (pathlib) are first-class: the core is subprocess git
# with user-supplied paths. RUF, C4, PL, ARG, TID, ERA are the second pass.
select = [
    "E", "F", "I", "N", "W", "UP", "ANN", "B", "A", "SIM",
    "S", "PTH", "RUF", "C4", "PL", "ARG", "TID", "ERA",
]
# PLR complexity metrics (arg counts, magic values, statement counts) follow
# the CLI and dataclass surfaces; ratcheting them is not a safety win.
ignore = ["PLR0913", "PLR2004", "PLR0915", "PLR0911", "PLR0912"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "S108", "S404"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
python_version = "3.11"

# networkx ships no type stubs; the per-module override is the durable
# alternative to scattering "type: ignore[import-untyped]" at import sites.
[[tool.mypy.overrides]]
module = "networkx.*"
ignore_missing_imports = true

[tool.coverage.run]
source = ["checkowners"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--cov=checkowners",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=85",
]
